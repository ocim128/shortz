# electron-builder — docs/technical/project-structure.md §packaging notes.
# Native/spawned-process resources must live outside the ASAR archive:
# Skia GlobalFonts.registerFromPath and the spawned ffmpeg/ffprobe binaries
# all go through OS file APIs that cannot see virtual app.asar paths.
appId: app.shortz.desktop
productName: ShortZ
directories:
  output: dist
files:
  - out/**
  - resources/**
asarUnpack:
  - resources/fonts/**
  - resources/templates/**
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/** # engine bundles ffprobe-static too (A's 8e21f61); same spawned-binary rule
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icons/icon.ico # placeholder (solid accent square) — real art pending
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
